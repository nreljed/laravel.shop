name: Remote Artisan (Production)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Endpoint to use"
        required: true
        type: choice
        options:
          - deploy-run
          - recover
        default: deploy-run
        help: "deploy-run uses Laravel routes (requires app booting). recover uses standalone PHP (works even when app is broken)."
      command:
        description: "Artisan command to run"
        required: true
        type: choice
        options:
          - recovery
          - migrate
          - migrate:fresh
          - migrate:status
          - db:seed
          - package:discover
          - config:cache
          - config:clear
          - route:cache
          - route:clear
          - view:cache
          - view:clear
          - cache:clear
          - storage:link
          - app:create-admin
          - permissions:sync
          - permissions:list
          - queue:restart
          - schedule:run
          - schedule:list
          - about
          - route:list
          - down
          - up
          - custom
        default: migrate
      custom_command:
        description: "Custom artisan command (only when command=custom)"
        required: false
        type: string
        default: ""
      args:
        description: "Comma-separated args (e.g. force,seed or no-interaction,email=x)"
        required: false
        type: string
        default: ""
      timeout:
        description: "Request timeout in seconds"
        required: false
        type: string
        default: "300"
      confirm:
        description: 'Type YES to confirm destructive commands (migrate:fresh, down)'
        required: true
        type: string
        default: "no"

permissions:
  contents: read

jobs:
  run:
    runs-on: [self-hosted]
    steps:
      - name: Validate destructive confirmation
        run: |
          CMD="${{ inputs.command }}"
          CONFIRM="${{ inputs.confirm }}"
          DANGEROUS="recovery migrate:fresh down"
          if echo "$DANGEROUS" | grep -qw "$CMD"; then
            if [ "$CONFIRM" != "YES" ]; then
              echo "::error::Destructive command '$CMD' requires confirm=YES (got '$CONFIRM')"
              exit 1
            fi
          fi
          echo "Confirmation OK for command: $CMD"

      - name: Resolve command
        id: resolve
        run: |
          CMD="${{ inputs.command }}"
          if [ "$CMD" = "custom" ]; then
            CMD="${{ inputs.custom_command }}"
            if [ -z "$CMD" ]; then
              echo "::error::custom_command is required when command=custom"
              exit 1
            fi
          fi
          echo "cmd=$CMD" >> $GITHUB_OUTPUT
          echo "Running: $CMD"

      - name: Build args array
        id: args
        run: |
          ARGS="${{ inputs.args }}"
          if [ -z "$ARGS" ]; then
            echo "json_args=[]" >> $GITHUB_OUTPUT
          else
            # Convert "force,seed" to ["--force","--seed"]
            IFS=',' read -ra PARTS <<< "$ARGS"
            JSON="["
            for i in "${!PARTS[@]}"; do
              ARG=$(echo "${PARTS[$i]}" | xargs)  # trim
              if [[ "$ARG" != --* ]]; then
                ARG="--$ARG"
              fi
              if [ $i -gt 0 ]; then JSON+=","; fi
              JSON+="\"$ARG\""
            done
            JSON+="]"
            echo "json_args=$JSON" >> $GITHUB_OUTPUT
          fi
          echo "Args: $JSON"

      - name: Run via /deploy/run (Laravel route)
        if: inputs.target == 'deploy-run'
        run: |
          CMD="${{ steps.resolve.outputs.cmd }}"
          ARGS_JSON='${{ steps.args.outputs.json_args }}'
          TIMEOUT="${{ inputs.timeout }}"

          echo "POST ${APP_URL}/deploy/run"
          echo "  command: $CMD"
          echo "  args: $ARGS_JSON"

          RESPONSE=$(curl -sf --max-time "$TIMEOUT" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${{ secrets.DEPLOY_TOKEN }}\",\"command\":\"$CMD\",\"args\":$ARGS_JSON}" \
            "${{ vars.APP_URL }}/deploy/run" 2>&1) || {
              echo ""
              echo "::warning::/deploy/run returned non-2xx. If the app is broken, try target=recover."
              echo "Response: $RESPONSE"
              exit 1
            }

          echo "$RESPONSE" | python3 -m json.tool 2>/dev/null || echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','error'))" 2>/dev/null || echo "error")
          if [ "$STATUS" != "ok" ]; then
            echo "::error::Command failed: $STATUS"
            exit 1
          fi

      - name: Run via /recover.php (standalone)
        if: inputs.target == 'recover'
        run: |
          CMD="${{ steps.resolve.outputs.cmd }}"
          ARGS="${{ inputs.args }}"
          TIMEOUT="${{ inputs.timeout }}"

          echo "GET ${APP_URL}/recover.php"
          echo "  cmd: $CMD"
          echo "  args: $ARGS"

          RESPONSE=$(curl -sf --max-time "$TIMEOUT" \
            "${{ vars.APP_URL }}/recover.php?token=${{ secrets.DEPLOY_TOKEN }}&cmd=$CMD&args=$ARGS" 2>&1) || {
              echo ""
              echo "::error::/recover.php failed"
              echo "Response: $RESPONSE"
              exit 1
            }

          echo "$RESPONSE" | python3 -m json.tool 2>/dev/null || echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','error'))" 2>/dev/null || echo "error")
          if [ "$STATUS" != "ok" ]; then
            echo "::error::Command failed: $STATUS"
            exit 1
          fi

      - name: Summary
        run: |
          echo "### Remote Artisan Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** ${{ inputs.target }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Command:** ${{ steps.resolve.outputs.cmd }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Args:** ${{ inputs.args }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** OK" >> $GITHUB_STEP_SUMMARY
