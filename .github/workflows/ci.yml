name: CI Validation

# ---------------------------------------------------------------------------
# PR-only validation: lint, typecheck, tests, pint
# Runs on: pull_request to main
# Purpose: fast-fail gate BEFORE merge — packages come pre-tested from core/shop repos
# ---------------------------------------------------------------------------

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, wsl]
    env:
      COMPOSER_ALLOW_SUPERUSER: 1
    steps:
      - uses: actions/checkout@v4

      - name: Verify tools
        run: php -v && node -v && composer -V

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-ci-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-ci-${{ runner.os }}-

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Create .env + SQLite database
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GH_TOKEN }}"}}'
        run: composer install --prefer-dist --no-interaction --no-scripts

      - name: Generate application key + migrate
        run: php artisan key:generate && php artisan migrate --force

      - name: Install npm dependencies + build
        run: |
          npm ci --legacy-peer-deps
          npm run build

      # ── Validation (cheapest first for fast-fail) ──────────────────────
      - name: Laravel Pint
        run: php vendor/bin/pint --test

      - name: PHP tests
        run: php artisan test --compact

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck
