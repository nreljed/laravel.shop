name: CI Validation

# ---------------------------------------------------------------------------
# Runner selection
# ---------------------------------------------------------------------------
# Set the repository variable "RUNNER" in:
#   Settings → Secrets and variables → Actions → Variables → New repository variable
#
#   Value              What it does
#   ─────────────────  ──────────────────────────────────────────────────────
#   (unset / empty)    Falls back to "self-hosted" (your local Windows PC)
#   self-hosted        Your registered runner on this machine
#   ubuntu-latest      GitHub-hosted Linux  (free 2 000 min/mo on private repo)
#   windows-latest     GitHub-hosted Windows (expensive — avoid unless needed)
#
# All steps use shell: bash (cross-platform) so both runners work.
# ---------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      skip-php-tests:
        description: "Skip PHP tests and Pint"
        type: boolean
        default: false
      skip-npm-tests:
        description: "Skip npm lint, typecheck, format, test, and build"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ vars.RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: fileinfo, gd, mbstring, pdo_mysql, pdo_sqlite, intl, bcmath, zip
          tools: composer:v2

      - name: Verify Node.js
        run: node --version; npm --version

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Create .env
        run: cp .env.example .env

      - name: Create SQLite database
        run: touch database/database.sqlite

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GH_TOKEN }}"}}'
        run: composer install --prefer-dist --no-interaction --no-scripts

      - name: Composer audit (security advisories)
        run: composer audit --no-interaction

      - name: Foundation check (core boundary)
        run: php scripts/foundation-check.php "$(pwd)"

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: npm audit (security advisories)
        run: npm audit --audit-level=high

      - name: ESLint
        if: ${{ !inputs.skip-npm-tests }}
        run: npm run lint

      - name: TypeScript check
        if: ${{ !inputs.skip-npm-tests }}
        run: npm run typecheck

      - name: Prettier check
        if: ${{ !inputs.skip-npm-tests }}
        run: npm run format:check

      - name: Frontend tests
        if: ${{ !inputs.skip-npm-tests }}
        run: npm run test

      - name: Build frontend assets
        if: ${{ !inputs.skip-npm-tests }}
        run: npm run build

      - name: PHP tests
        if: ${{ !inputs.skip-php-tests }}
        run: php artisan test --parallel --compact

      - name: Laravel Pint
        if: ${{ !inputs.skip-php-tests }}
        run: php vendor/bin/pint --test
