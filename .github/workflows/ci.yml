name: CI Validation

# ---------------------------------------------------------------------------
# PR-only checks: lint, typecheck, tests, pint
# Lightweight — no npm build, no deploy packaging
# ---------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      skip-php-tests:
        description: "Skip PHP tests and Pint"
        type: boolean
        default: false
      skip-npm-tests:
        description: "Skip npm lint, typecheck, format, test"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ vars.RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: fileinfo, gd, mbstring, pdo_mysql, pdo_sqlite, intl, bcmath, zip
          tools: composer:v2

      - name: Verify Node.js
        run: node --version; npm --version

      - name: Restore composer cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Create .env
        run: Copy-Item .env.example .env

      - name: Create SQLite database
        run: New-Item -ItemType File -Path database/database.sqlite -Force | Out-Null

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GH_TOKEN }}"}}'
        run: composer install --prefer-dist --no-interaction --no-scripts

      - name: Foundation check (core boundary)
        run: php scripts/foundation-check.php (Get-Location).Path

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend assets (needed for Vite manifest in PHP tests)
        if: ${{ !inputs.skip-npm-tests }}
        run: npm run build

      - name: ESLint
        if: ${{ !inputs.skip-npm-tests }}
        run: npm run lint

      - name: TypeScript check
        if: ${{ !inputs.skip-npm-tests }}
        run: npm run typecheck

      - name: Prettier check
        if: ${{ !inputs.skip-npm-tests }}
        run: npm run format:check

      - name: Frontend tests
        if: ${{ !inputs.skip-npm-tests }}
        run: npm run test

      - name: PHP tests
        if: ${{ !inputs.skip-php-tests }}
        run: php artisan test --parallel --compact

      - name: Laravel Pint
        if: ${{ !inputs.skip-php-tests }}
        run: php vendor/bin/pint --test
