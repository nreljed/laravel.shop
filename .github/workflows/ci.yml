name: CI Validation

# ---------------------------------------------------------------------------
# PR-only validation: lint, typecheck, tests, pint
# Runs on: pull_request to main
# Purpose: fast-fail gate BEFORE merge — packages come pre-tested from core/shop repos
# ---------------------------------------------------------------------------

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: fileinfo, gd, mbstring, pdo_mysql, pdo_sqlite, intl, bcmath, zip
          tools: composer:v2

      - name: Verify Node.js
        run: node --version && npm --version

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-win-${{ hashFiles('composer.lock') }}
          restore-keys: composer-win-

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-win-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-win-

      - name: Create .env + SQLite database
        shell: bash
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GH_TOKEN }}"}}'
        run: composer install --prefer-dist --no-interaction --no-scripts

      - name: Generate application key + migrate
        run: php artisan key:generate && php artisan migrate --force

      - name: Install npm dependencies + build
        shell: bash
        run: |
          npm ci --legacy-peer-deps
          npm run build

      # ── Validation (cheapest first for fast-fail) ──────────────────────
      - name: Laravel Pint
        run: php vendor/bin/pint --test

      - name: PHP tests
        run: php artisan test --compact

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck
