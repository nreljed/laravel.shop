name: Build Deploy Package

# ---------------------------------------------------------------------------
# Runner selection
# ---------------------------------------------------------------------------
# Set the repository variable "RUNNER" in:
#   Settings → Secrets and variables → Actions → Variables → New repository variable
#
#   Value              What it does
#   ─────────────────  ──────────────────────────────────────────────────────
#   (unset / empty)    Falls back to "self-hosted" (your local Windows PC)
#   self-hosted        Your registered runner on this machine
#   ubuntu-latest      GitHub-hosted Linux  (free 2 000 min/mo on private repo)
#   windows-latest     GitHub-hosted Windows (expensive — avoid unless needed)
#
# All steps use shell: bash / pwsh (cross-platform) so both runners work.
# ---------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      version:
        description: "Version string for the deploy.zip"
        required: true
        type: string
    outputs:
      version:
        description: "The version used"
        value: ${{ jobs.package.outputs.version }}

permissions:
  contents: write

jobs:
  package:
    runs-on: ${{ vars.RUNNER || 'self-hosted' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: fileinfo, gd, mbstring, pdo_mysql, pdo_sqlite, intl, bcmath, zip
          tools: composer:v2

      - name: Verify Node.js
        run: node --version; npm --version

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          else
            VER="0.1.0"
            LAST_TAG=$(git tag --merged HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            if [ -n "$LAST_TAG" ]; then
              IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST_TAG#v}"
              COMMITS=$(git log "$LAST_TAG..HEAD" --pretty=format:"%s%B")
              BUMP="patch"
              echo "$COMMITS" | grep -qE 'BREAKING CHANGE|^[a-z]+(\([^)]*\))!:' && BUMP="major"
              echo "$COMMITS" | grep -qE '^feat' && [ "$BUMP" != "major" ] && BUMP="minor"
              case "$BUMP" in
                major) VER="$((MAJOR + 1)).0.0" ;;
                minor) VER="$MAJOR.$((MINOR + 1)).0" ;;
                *)     VER="$MAJOR.$MINOR.$((PATCH + 1))" ;;
              esac
              echo "Bumping from $LAST_TAG → $VER"
            else
              echo "No semver tags found, starting at 0.1.0"
            fi
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Generate build .env (SQLite)
        shell: bash
        run: |
          DB_PATH="$(pwd -W 2>/dev/null || pwd)/database/database.sqlite"
          cat > .env <<EOF
          APP_NAME="Shop App"
          APP_ENV=local
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=true
          APP_URL=http://localhost
          DB_CONNECTION=sqlite
          DB_DATABASE=$DB_PATH
          SESSION_DRIVER=file
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync
          CACHE_STORE=file
          DEPLOY_TOKEN=build
          GITHUB_TOKEN=build
          EOF
          touch database/database.sqlite

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-dist-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies (no-dev, optimized)
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GH_TOKEN }}"}}'
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-scripts

      - name: Package Discover
        run: php artisan package:discover --ansi

      - name: Run migrations (SQLite build)
        run: php artisan migrate --force

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: Build frontend assets
        run: npm run build

      - name: Overwrite .env with production settings
        shell: bash
        run: |
          cat > .env <<EOF
          APP_NAME="Shop App"
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=${{ vars.APP_URL }}
          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en
          BCRYPT_ROUNDS=12
          LOG_CHANNEL=stack
          LOG_LEVEL=error
          DB_CONNECTION=mysql
          DB_HOST=localhost
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          SESSION_DOMAIN=${{ vars.SESSION_DOMAIN }}
          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync
          CACHE_STORE=file
          GITHUB_REPO=nreljed/laravel.shop
          DEPLOY_TOKEN=${{ secrets.DEPLOY_TOKEN }}
          GITHUB_TOKEN=${{ secrets.GH_TOKEN }}
          DB_MAINTENANCE_ENABLED=${{ vars.DB_MAINTENANCE_ENABLED || 'false' }}
          EOF

      - name: Copy deploy script
        run: cp scripts/deploy-cron.php deploy.php

      - name: Record dashboard-core version
        shell: bash
        run: |
          CORE_VERSION=$(php -r "echo json_decode(file_get_contents('vendor/nreljed/dashboard-core/composer.json'))->version;")
          mkdir -p storage/app
          echo "{\"name\":\"dashboard-core\",\"version\":\"$CORE_VERSION\",\"sha\":null}" > storage/app/core.json
          echo "core.json recorded: dashboard-core $CORE_VERSION"

      - name: Create deploy.zip
        shell: bash
        run: |
          ITEMS=(
            artisan composer.json composer.lock package.json package-lock.json
            app bootstrap config database public resources routes
            storage vendor deploy.php .htaccess
          )
          rm -f deploy.zip
          rm -f bootstrap/cache/packages.php bootstrap/cache/services.php
          if [ "$RUNNER_OS" = "Windows" ]; then
            "C:\Program Files\7-Zip\7z.exe" a -tzip -mx=3 deploy.zip "${ITEMS[@]}"
          elif command -v 7z &>/dev/null; then
            7z a -tzip -mx=3 deploy.zip "${ITEMS[@]}"
          else
            zip -r -3 deploy.zip "${ITEMS[@]}"
          fi
          SIZE=$(du -m deploy.zip | cut -f1)
          echo "deploy.zip created: ${SIZE} MB"

      - name: Generate release notes
        shell: bash
        run: |
          npm install -g git-cliff 2>/dev/null
          BASE_TAG=$(git tag --merged HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          [ -z "$BASE_TAG" ] && BASE_TAG="v0.1.0"
          echo "Release notes base: $BASE_TAG"
          git-cliff "$BASE_TAG..HEAD" --strip header -o release-notes.md 2>/dev/null || true
          [ ! -f release-notes.md ] && echo "No changes for v${{ steps.version.outputs.version }}" > release-notes.md
          git-cliff -o CHANGELOG.md 2>/dev/null || true

      # Canonical per deploy skill: softprops/action-gh-release creates (or
      # updates) the GitHub Release and attaches deploy.zip as a release asset.
      # Works on any runner (node20 action, no shell needed).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: deploy.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
