name: Build Deploy Package

# ---------------------------------------------------------------------------
# Runner selection
# ---------------------------------------------------------------------------
# Set the repository variable "RUNNER" in:
#   Settings → Secrets and variables → Actions → Variables → New repository variable
#
#   Value              What it does
#   ─────────────────  ──────────────────────────────────────────────────────
#   (unset / empty)    Falls back to "self-hosted" (your local Windows PC)
#   self-hosted        Your registered runner on this machine
#   ubuntu-latest      GitHub-hosted Linux  (free 2 000 min/mo on private repo)
#   windows-latest     GitHub-hosted Windows (expensive — avoid unless needed)
#
# All steps use pwsh (cross-platform) so both runners work.
# pwsh is installed on: Windows (default), ubuntu-latest, macos-latest.
# ---------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      version:
        description: "Version string for the deploy.zip"
        required: true
        type: string
    outputs:
      version:
        description: "The version used"
        value: ${{ jobs.package.outputs.version }}

permissions:
  contents: write

jobs:
  package:
    runs-on: ${{ vars.RUNNER || 'self-hosted' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Prepend Windows native tar before Git's broken tar — fixes actions/cache@v4 on Windows
      - name: Fix tar for cache
        shell: pwsh
        run: |
          $gitTar = "C:\Program Files\Git\usr\bin"
          $currentPath = [System.Environment]::GetEnvironmentVariable("PATH", "Process")
          $newPath = $currentPath -replace [regex]::Escape($gitTar + ";"), ""
          $newPath = "C:\Windows\System32;" + $newPath
          echo $newPath >> $env:GITHUB_PATH

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: fileinfo, gd, mbstring, pdo_mysql, pdo_sqlite, intl, bcmath, zip
          tools: composer:v2

      - name: Verify Node.js
        run: node --version; npm --version

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ inputs.version }}" -ne "") {
            $ver = "${{ inputs.version }}"
          } else {
            $ver = "0.1.0"
            $lastTag = git tag --merged HEAD |
              Where-Object { $_ -match '^v[0-9]+\.[0-9]+\.[0-9]+$' } |
              Sort-Object { [version]($_ -replace '^v', '') } |
              Select-Object -Last 1
            if ($lastTag) {
              $seg = $lastTag.TrimStart('v').Split('.')
              $major = [int]$seg[0]; $minor = [int]$seg[1]; $patch = [int]$seg[2]
              $commits = git log "$lastTag..HEAD" --pretty=format:"%s%B"
              $bump = "patch"
              foreach ($c in $commits) {
                if ($c -match 'BREAKING CHANGE' -or $c -match '^[a-z]+(\([^)]*\))?!:') { $bump = "major"; break }
                if ($c -match '^feat') { $bump = "minor" }
              }
              switch ($bump) {
                "major" { $ver = "$($major + 1).0.0" }
                "minor" { $ver = "$major.$($minor + 1).0" }
                default { $ver = "$major.$minor.$($patch + 1)" }
              }
              Write-Output "Bumping from $lastTag (next: $ver)"
            } else {
              Write-Output "No semver tags found, starting at 0.1.0"
            }
          }
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Generate build .env (SQLite)
        shell: pwsh
        run: |
          $dbPath = "$((Get-Location).Path.Replace('\', '/'))/database/database.sqlite"
          @"
          APP_NAME="Shop App"
          APP_ENV=local
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=true
          APP_URL=http://localhost
          DB_CONNECTION=sqlite
          DB_DATABASE=$dbPath
          SESSION_DRIVER=file
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync
          CACHE_STORE=file
          DEPLOY_TOKEN=build
          GITHUB_TOKEN=build
          "@ | Set-Content -Path .env -Encoding UTF8
          New-Item -ItemType File -Path database/database.sqlite -Force | Out-Null

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-dist-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies (no-dev, optimized)
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GH_TOKEN }}"}}'
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-scripts

      - name: Package Discover
        run: php artisan package:discover --ansi

      - name: Run migrations (SQLite build)
        run: php artisan migrate --force

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: Build frontend assets
        run: npm run build

      - name: Overwrite .env with production settings
        shell: pwsh
        run: |
          @'
          APP_NAME="Shop App"
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=${{ vars.APP_URL }}
          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en
          BCRYPT_ROUNDS=12
          LOG_CHANNEL=stack
          LOG_LEVEL=error
          DB_CONNECTION=mysql
          DB_HOST=localhost
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          SESSION_DOMAIN=${{ vars.SESSION_DOMAIN }}
          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync
          CACHE_STORE=file
          GITHUB_REPO=nreljed/laravel.shop
          DEPLOY_TOKEN=${{ secrets.DEPLOY_TOKEN }}
          GITHUB_TOKEN=${{ secrets.GH_TOKEN }}
          DB_MAINTENANCE_ENABLED=${{ vars.DB_MAINTENANCE_ENABLED || 'false' }}
          '@ | Set-Content -Path .env -Encoding UTF8

      - name: Copy deploy script
        run: Copy-Item -Path scripts/deploy-cron.php -Destination deploy.php

      - name: Record dashboard-core version
        shell: pwsh
        run: |
          $coreMeta = Get-Content "vendor\nreljed\dashboard-core\composer.json" -Raw | ConvertFrom-Json
          $coreVersion = $coreMeta.version
          New-Item -ItemType Directory -Path "storage\app" -Force | Out-Null
          @{ name = "dashboard-core"; version = $coreVersion; sha = $null } | ConvertTo-Json | Set-Content -Path "storage\app\core.json" -Encoding UTF8
          Write-Output "core.json recorded: dashboard-core $coreVersion"

      - name: Create deploy.zip
        shell: pwsh
        run: |
          $src = (Get-Location).Path
          $zip = "$src\deploy.zip"
          Remove-Item -Force $zip -ErrorAction SilentlyContinue
          $cacheDir = "$src\bootstrap\cache"
          if (Test-Path $cacheDir) {
            Remove-Item "$cacheDir\packages.php", "$cacheDir\services.php" -Force -ErrorAction SilentlyContinue
          }
          $items = @(
            "artisan", "composer.json", "composer.lock", "package.json", "package-lock.json",
            "app", "bootstrap", "config", "database", "public", "resources", "routes",
            "storage", "vendor", "deploy.php", ".htaccess"
          )
          if ($IsLinux) {
            if (Get-Command 7z -ErrorAction SilentlyContinue) {
              & 7z a -tzip -mx=3 $zip $items
            } else {
              & zip -r -3 $zip $items
            }
          } else {
            $sevenZip = "C:\Program Files\7-Zip\7z.exe"
            & $sevenZip a -tzip -mx=3 $zip $items
          }
          if ($LASTEXITCODE -gt 1) {
            Write-Error "Zip failed with exit code $LASTEXITCODE"
            exit 1
          }
          $size = [Math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Output "deploy.zip created: $size MB"

      - name: Generate release notes
        shell: pwsh
        run: |
          npm install -g git-cliff 2>$null
          $baseTag = git tag --merged HEAD |
            Where-Object { $_ -match '^v[0-9]+\.[0-9]+\.[0-9]+$' } |
            Sort-Object { [version]($_ -replace '^v', '') } |
            Select-Object -Last 1
          if (-not $baseTag) { $baseTag = "v0.1.0" }
          Write-Output "Release notes base: $baseTag"
          git-cliff "$baseTag..HEAD" --strip header -o release-notes.md 2>$null
          if (-not (Test-Path release-notes.md)) {
            Set-Content release-notes.md "No changes for v${{ steps.version.outputs.version }}"
          }
          git-cliff -o CHANGELOG.md 2>$null

      # Canonical per deploy skill: softprops/action-gh-release creates (or
      # updates) the GitHub Release and attaches deploy.zip as a release asset.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: deploy.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
