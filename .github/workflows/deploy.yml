name: Deploy to Production

on:
  push:
    branches: [master]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  package:
    needs: ci
    uses: ./.github/workflows/deploy-package.yml
    with:
      version: ""
    secrets: inherit

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: version
        run: |
          VER="${{ needs.package.outputs.version }}"
          if [ -z "$VER" ]; then
            VER="0.1.0"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          npm install -g git-cliff
          git-cliff --unreleased --strip header -o release-notes.md 2>/dev/null || echo "No changes for v${{ steps.version.outputs.version }}" > release-notes.md
          git-cliff -o CHANGELOG.md 2>/dev/null || true

      - name: Download deploy.zip artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_TOKEN }}
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          body_path: release-notes.md
          files: deploy.zip
          fail_on_unmatched_files: true

  push-deploy:
    needs: [package, release]
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: version
        run: echo "version=${{ needs.package.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Download deploy.zip artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-package

      - name: Upload deploy archive to server
        shell: bash
        run: |
          VER="v${{ steps.version.outputs.version }}"
          echo "Release: $VER"
          # Prefer /deploy/check: the server pulls deploy.zip from the GitHub API itself,
          # avoiding a large upload through the edge. Validate the real status, not just JSON.
          CHECK_RESP=$(curl -s -X POST --max-time 300 \
            "https://shop.laravel.tunispromo.tn/deploy/check?token=${{ secrets.DEPLOY_TOKEN }}" 2>&1)
          if echo "$CHECK_RESP" | head -1 | grep -q '"status":"deployed"'; then
            echo "Deployed via /deploy/check (GitHub API)"
            echo "$CHECK_RESP" | head -1
          elif echo "$CHECK_RESP" | head -1 | grep -q '"status":"current"'; then
            echo "Already on $VER via /deploy/check"
            echo "$CHECK_RESP" | head -1
          else
            echo "check not usable: $(echo "$CHECK_RESP" | head -1 | cut -c1-160)"
            # Fallback: direct upload (large file, can be flaky through edge/CDN)
            UPLOAD_RESP=$(curl -s -w "\n%{http_code}" --max-time 300 \
              -F "file=@deploy.zip;filename=deploy.zip" \
              "https://shop.laravel.tunispromo.tn/deploy/upload?token=${{ secrets.DEPLOY_TOKEN }}" 2>&1)
            HTTP_CODE=$(echo "$UPLOAD_RESP" | tail -1)
            BODY=$(echo "$UPLOAD_RESP" | sed '$d')
            if [ "$HTTP_CODE" = "200" ] && echo "$BODY" | head -1 | grep -q '"status":"deployed"'; then
              echo "Deployed via /deploy/upload"
              echo "$BODY" | head -1
            else
              echo "Upload failed (HTTP $HTTP_CODE)"
              echo "Deploy failed. Release created at:"
              echo "https://github.com/nreljed/laravel.shop/releases/tag/$VER"
              echo "Manual deploy: download deploy.zip from release, upload to server, extract, then visit:"
              echo "https://shop.laravel.tunispromo.tn/deploy/cache-clear?token=${{ secrets.DEPLOY_TOKEN }}"
              exit 1
            fi
          fi

      - name: FTP Upload fallback (DirectAdmin)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ftpUrl = "ftp://${{ secrets.FTP_SERVER }}/domains/shop.laravel.tunispromo.tn/public_html/deploy.zip"
          $cred = New-Object System.Net.NetworkCredential("${{ secrets.FTP_USERNAME }}", "${{ secrets.FTP_PASSWORD }}")
          try {
            $ftp = [System.Net.FtpWebRequest]::Create($ftpUrl)
            $ftp.Method = [System.Net.WebRequestMethods+Ftp]::UploadFile
            $ftp.Credentials = $cred
            $ftp.UseBinary = $true
            $ftp.UsePassive = $true
            $ftp.KeepAlive = $false
            $fileBytes = [System.IO.File]::ReadAllBytes("deploy.zip")
            $ftp.ContentLength = $fileBytes.Length
            $rs = $ftp.GetRequestStream()
            $rs.Write($fileBytes, 0, $fileBytes.Length)
            $rs.Close()
            $resp = $ftp.GetResponse()
            Write-Output "FTP upload OK: $($resp.StatusDescription)"
            $resp.Close()
            Write-Output "---"
            Write-Output "Extract via DirectAdmin File Manager, then visit:"
            Write-Output "https://shop.laravel.tunispromo.tn/deploy/cache-clear?token=${{ secrets.DEPLOY_TOKEN }}"
          } catch {
            Write-Output "FTP upload failed: $_"
            $VER = "${{ steps.version.outputs.version }}"
            Write-Output "Manual steps:"
            Write-Output "1. Download from: https://github.com/nreljed/laravel.shop/releases/download/v$VER/deploy.zip"
            Write-Output "2. Upload via DirectAdmin File Manager to public_html/"
            Write-Output "3. Extract, then visit:"
            Write-Output "   https://shop.laravel.tunispromo.tn/deploy/cache-clear?token=${{ secrets.DEPLOY_TOKEN }}"
          }
