name: Deploy to Production

# ---------------------------------------------------------------------------
# Ultra-optimized deploy: ONE job for validate+build+release
# ---------------------------------------------------------------------------
# Previously: ci.yml (11 min) → deploy-package.yml (14 min) → push-deploy (1.5 min) = 27 min
# Now:        build (8 min) → push-deploy (1.5 min) = ~10 min
#
# Key optimizations:
#   1. ONE composer install (with dev), strip to --no-dev before zip
#   2. ONE npm ci + ONE npm run build
#   3. Fixed Windows cache (7z-based, not Git's broken tar)
#   4. Removed redundant security audits from push flow
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy-shop-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ vars.RUNNER || 'self-hosted' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout (full history for git-cliff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: fileinfo, gd, mbstring, pdo_mysql, pdo_sqlite, intl, bcmath, zip
          tools: composer:v2

      - name: Verify Node.js
        run: node --version; npm --version

      # ── Fix Windows cache: actions/cache@v4 uses Git's tar which breaks ──
      - name: Fix tar for cache
        shell: pwsh
        run: |
          $gitTar = "C:\Program Files\Git\usr\bin"
          $sys32 = "C:\Windows\System32"
          $currentPath = [System.Environment]::GetEnvironmentVariable("PATH", "Process")
          $newPath = $currentPath -replace [regex]::Escape($gitTar + ";"), ""
          if ($newPath -notmatch [regex]::Escape($sys32)) {
            $newPath = "$sys32;$newPath"
          }
          echo $newPath >> $env:GITHUB_PATH

      - name: Restore composer cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # ── Environment ─────────────────────────────────────────────────────
      - name: Create build .env
        shell: pwsh
        run: |
          $dbPath = "$((Get-Location).Path.Replace('\', '/'))/database/database.sqlite"
          @"
          APP_NAME="Shop App"
          APP_ENV=local
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=true
          APP_URL=http://localhost
          DB_CONNECTION=sqlite
          DB_DATABASE=$dbPath
          SESSION_DRIVER=file
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync
          CACHE_STORE=file
          DEPLOY_TOKEN=build
          GITHUB_TOKEN=build
          "@ | Set-Content -Path .env -Encoding UTF8
          New-Item -ItemType File -Path database/database.sqlite -Force | Out-Null

      # ── Install (ONE composer, ONE npm) ──────────────────────────────────
      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GH_TOKEN }}"}}'
        run: composer install --prefer-dist --no-interaction --no-scripts

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      # ── Validate ─────────────────────────────────────────────────────────
      - name: Foundation check (core boundary)
        run: php scripts/foundation-check.php (Get-Location).Path

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Prettier check
        run: npm run format:check

      - name: Frontend tests
        run: npm run test

      - name: PHP tests
        run: php artisan test 2>&1

      - name: Laravel Pint
        run: php vendor/bin/pint --test

      # ── Package (strip dev deps, build assets, create zip) ──────────────
      - name: Strip dev dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GH_TOKEN }}"}}'
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-scripts

      - name: Build frontend assets
        run: npm run build

      - name: Overwrite .env with production settings
        shell: pwsh
        run: |
          @'
          APP_NAME="Shop App"
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=${{ vars.APP_URL }}
          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en
          BCRYPT_ROUNDS=12
          LOG_CHANNEL=stack
          LOG_LEVEL=error
          DB_CONNECTION=mysql
          DB_HOST=localhost
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          SESSION_DOMAIN=${{ vars.SESSION_DOMAIN }}
          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync
          CACHE_STORE=file
          GITHUB_REPO=nreljed/laravel.shop
          DEPLOY_TOKEN=${{ secrets.DEPLOY_TOKEN }}
          GITHUB_TOKEN=${{ secrets.GH_TOKEN }}
          DB_MAINTENANCE_ENABLED=${{ vars.DB_MAINTENANCE_ENABLED || 'false' }}
          '@ | Set-Content -Path .env -Encoding UTF8

      - name: Copy deploy script
        run: Copy-Item -Path scripts/deploy-cron.php -Destination deploy.php

      - name: Record dashboard-core version
        shell: pwsh
        run: |
          $coreMeta = Get-Content "vendor\nreljed\dashboard-core\composer.json" -Raw | ConvertFrom-Json
          $coreVersion = $coreMeta.version
          New-Item -ItemType Directory -Path "storage\app" -Force | Out-Null
          @{ name = "dashboard-core"; version = $coreVersion; sha = $null } | ConvertTo-Json | Set-Content -Path "storage\app\core.json" -Encoding UTF8
          Write-Output "core.json recorded: dashboard-core $coreVersion"

      # ── Create deploy.zip ────────────────────────────────────────────────
      - name: Create deploy.zip
        shell: pwsh
        run: |
          $src = (Get-Location).Path
          $zip = "$src\deploy.zip"
          Remove-Item -Force $zip -ErrorAction SilentlyContinue
          $cacheDir = "$src\bootstrap\cache"
          if (Test-Path $cacheDir) {
            Remove-Item "$cacheDir\packages.php", "$cacheDir\services.php" -Force -ErrorAction SilentlyContinue
          }
          $items = @(
            "artisan", "composer.json", "composer.lock", "package.json", "package-lock.json",
            "app", "bootstrap", "config", "database", "public", "resources", "routes",
            "storage", "vendor", "deploy.php", ".htaccess"
          )
          if ($IsLinux) {
            if (Get-Command 7z -ErrorAction SilentlyContinue) {
              & 7z a -tzip -mx=3 $zip $items
            } else {
              & zip -r -3 $zip $items
            }
          } else {
            $sevenZip = "C:\Program Files\7-Zip\7z.exe"
            & $sevenZip a -tzip -mx=3 $zip $items
          }
          if ($LASTEXITCODE -gt 1) {
            Write-Error "Zip failed with exit code $LASTEXITCODE"
            exit 1
          }
          $size = [Math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Output "deploy.zip created: $size MB"

      # ── Version + Release ────────────────────────────────────────────────
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $ver = "0.1.0"
          $lastTag = git tag --merged HEAD |
            Where-Object { $_ -match '^v[0-9]+\.[0-9]+\.[0-9]+$' } |
            Sort-Object { [version]($_ -replace '^v', '') } |
            Select-Object -Last 1
          if ($lastTag) {
            $seg = $lastTag.TrimStart('v').Split('.')
            $major = [int]$seg[0]; $minor = [int]$seg[1]; $patch = [int]$seg[2]
            $commits = git log "$lastTag..HEAD" --pretty=format:"%s%B"
            $bump = "patch"
            foreach ($c in $commits) {
              if ($c -match 'BREAKING CHANGE' -or $c -match '^[a-z]+(\([^)]*\))?!:') { $bump = "major"; break }
              if ($c -match '^feat') { $bump = "minor" }
            }
            switch ($bump) {
              "major" { $ver = "$($major + 1).0.0" }
              "minor" { $ver = "$major.$($minor + 1).0" }
              default { $ver = "$major.$minor.$($patch + 1)" }
            }
            Write-Output "Bumping from $lastTag (next: $ver)"
          }
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Generate release notes
        shell: pwsh
        run: |
          npm install -g git-cliff 2>$null
          $baseTag = git tag --merged HEAD |
            Where-Object { $_ -match '^v[0-9]+\.[0-9]+\.[0-9]+$' } |
            Sort-Object { [version]($_ -replace '^v', '') } |
            Select-Object -Last 1
          if (-not $baseTag) { $baseTag = "v0.1.0" }
          git-cliff "$baseTag..HEAD" --strip header -o release-notes.md 2>$null
          if (-not (Test-Path release-notes.md)) {
            Set-Content release-notes.md "No changes for v${{ steps.version.outputs.version }}"
          }
          git-cliff -o CHANGELOG.md 2>$null

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: deploy.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  push-deploy:
    needs: build
    runs-on: ${{ vars.RUNNER || 'self-hosted' }}
    steps:
      - name: Download deploy.zip from release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $VER = "v${{ needs.build.outputs.version }}"
          Write-Output "Downloading deploy.zip from release $VER"
          gh release download $VER `
            --repo "${{ github.repository }}" `
            --pattern "deploy.zip" `
            --clobber
          Get-Item deploy.zip | Select-Object Name, Length

      - name: Push GITHUB_TOKEN to server .env
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $envUrl = "${{ vars.APP_URL }}/deploy/env?token=${{ secrets.DEPLOY_TOKEN }}"
          for ($i = 1; $i -le 3; $i++) {
            $resp = curl.exe -s -X POST --max-time 60 -H "Content-Type: application/json" `
              -d "{`"values`":{`"GITHUB_TOKEN`":`"${{ secrets.GH_TOKEN }}`"}}" `
              $envUrl 2>&1
            $first = ($resp -split "`n")[0]
            Write-Output "[env $i/3] $first"
            if ($first -match '"success":true') {
              Write-Output "GITHUB_TOKEN pushed to server .env"
              exit 0
            }
            if ($i -lt 3) { Start-Sleep -Seconds 20 }
          }
          Write-Output "GITHUB_TOKEN push did not confirm; manual: POST $envUrl"

      - name: Upload deploy archive to server
        shell: pwsh
        run: |
          $VER = "v${{ needs.build.outputs.version }}"
          Write-Output "Release: $VER"
          $checkUrl = "${{ vars.APP_URL }}/deploy/check?token=${{ secrets.DEPLOY_TOKEN }}"
          $uploadUrl = "${{ vars.APP_URL }}/deploy/upload?token=${{ secrets.DEPLOY_TOKEN }}"

          function Poll-Check {
            $consecutiveNonJson = 0
            for ($i = 1; $i -le 8; $i++) {
              $resp = curl.exe -s -X POST --max-time 30 $checkUrl 2>&1
              $first = ($resp -split "`n")[0]
              if ($first -match '"status":"deployed"') {
                Write-Output "Deployed via /deploy/check (GitHub API)"
                Write-Output $first
                return $true
              } elseif ($first -match '"status":"current"') {
                $consecutiveNonJson = 0
                if ($first -match "`"tag`":`"$VER`"") {
                  Write-Output "Confirmed on $VER via /deploy/check"
                  Write-Output $first
                  return $true
                }
                $currentTag = if ($first -match '"tag":"([^"]*)"') { $Matches[1] } else { "?" }
                Write-Output "[poll $i/8] server on $currentTag, waiting for $VER"
              } elseif ($first -match '"status":"locked"') {
                $consecutiveNonJson = 0
                Write-Output "[poll $i/8] server still working (locked)"
              } else {
                $consecutiveNonJson++
                Write-Output "[poll $i/8] server not responding (non-JSON $consecutiveNonJson/2)"
                if ($consecutiveNonJson -ge 2) {
                  Write-Output "Fast-fail: server is broken, skipping remaining polls"
                  return $false
                }
              }
              if ($i -lt 8) { Start-Sleep -Seconds 15 }
            }
            return $false
          }

          function Confirm-Deployed {
            $consecutiveNonJson = 0
            for ($i = 1; $i -le 8; $i++) {
              $resp = curl.exe -s --max-time 30 $checkUrl 2>&1
              $first = ($resp -split "`n")[0]
              if ($first -match '"status":"deployed"') {
                Write-Output "Confirmed deployed via /deploy/check"
                Write-Output $first
                return $true
              } elseif ($first -match '"status":"current"') {
                $consecutiveNonJson = 0
                if ($first -match "`"tag`":`"$VER`"") {
                  Write-Output "Confirmed on $VER via /deploy/check"
                  Write-Output $first
                  return $true
                }
                Write-Output "[confirm $i/8] tag not yet $VER, retrying"
              } elseif ($first -match '"status":"locked"') {
                $consecutiveNonJson = 0
                Write-Output "[confirm $i/8] server still working (locked), retrying"
              } else {
                $consecutiveNonJson++
                Write-Output "[confirm $i/8] server not responding (non-JSON $consecutiveNonJson/2)"
                if ($consecutiveNonJson -ge 2) {
                  Write-Output "Fast-fail: server is broken, skipping remaining confirms"
                  return $false
                }
              }
              if ($i -lt 8) { Start-Sleep -Seconds 15 }
            }
            return $false
          }

          if (Poll-Check) {
            Write-Output "push-deploy OK (check path)"
          } else {
            Write-Output "check path did not confirm $VER, uploading deploy.zip directly"
            $uploadResp = curl.exe -s -w "\n%{http_code}" --max-time 300 `
              -F "file=@deploy.zip;filename=deploy.zip" `
              $uploadUrl 2>&1
            $lines = $uploadResp -split "`n"
            $httpCode = $lines[-1]
            $body = ($lines[0..($lines.Count-2)] -join "`n")
            Write-Output "Upload HTTP $httpCode"
            if ($httpCode -eq "200" -and $body -match '"status":"deployed"') {
              Write-Output "Deployed via /deploy/upload"
              Write-Output "push-deploy OK (upload path)"
            } else {
              Write-Output "Upload response not clean (HTTP $httpCode), confirming via /deploy/check..."
              if (Confirm-Deployed) {
                Write-Output "push-deploy OK (confirmed after upload)"
              } else {
                Write-Output "Deploy not confirmed. Release at: https://github.com/${{ github.repository }}/releases/tag/$VER"
                Write-Output "Manual: download deploy.zip, upload to server, extract, then visit:"
                Write-Output "${{ vars.APP_URL }}/deploy/cache-clear?token=${{ secrets.DEPLOY_TOKEN }}"
                exit 1
              }
            }
          }

      - name: FTP Upload fallback (DirectAdmin)
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $ftpPort = if ("${{ secrets.FTP_PORT }}") { "${{ secrets.FTP_PORT }}" } else { "21" }
          $ftpUrl = "ftp://${{ secrets.FTP_SERVER }}:$ftpPort/deploy.zip"
          $cred = New-Object System.Net.NetworkCredential("${{ secrets.FTP_USERNAME }}", "${{ secrets.FTP_PASSWORD }}")
          try {
            $ftp = [System.Net.FtpWebRequest]::Create($ftpUrl)
            $ftp.Method = [System.Net.WebRequestMethods+Ftp]::UploadFile
            $ftp.Credentials = $cred
            $ftp.UseBinary = $true
            $ftp.UsePassive = $true
            $ftp.KeepAlive = $false
            $fileBytes = [System.IO.File]::ReadAllBytes("deploy.zip")
            $ftp.ContentLength = $fileBytes.Length
            $rs = $ftp.GetRequestStream()
            $rs.Write($fileBytes, 0, $fileBytes.Length)
            $rs.Close()
            $resp = $ftp.GetResponse()
            Write-Output "FTP upload OK: $($resp.StatusDescription)"
            $resp.Close()
            Write-Output "---"
            Write-Output "Extract via DirectAdmin File Manager, then visit:"
            Write-Output "${{ vars.APP_URL }}/deploy/cache-clear?token=${{ secrets.DEPLOY_TOKEN }}"
          } catch {
            Write-Output "FTP upload failed: $_"
            $VER = "v${{ needs.build.outputs.version }}"
            Write-Output "Manual steps:"
            Write-Output "1. Download from: https://github.com/${{ github.repository }}/releases/download/$VER/deploy.zip"
            Write-Output "2. Upload via DirectAdmin File Manager to public_html/"
            Write-Output "3. Extract, then visit:"
            Write-Output "   ${{ vars.APP_URL }}/deploy/cache-clear?token=${{ secrets.DEPLOY_TOKEN }}"
          }
