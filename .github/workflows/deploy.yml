name: Deploy to Production

# ---------------------------------------------------------------------------
# Runner selection
# ---------------------------------------------------------------------------
# Set the repository variable "RUNNER" in:
#   Settings → Secrets and variables → Actions → Variables → New repository variable
#
#   Value              What it does
#   ─────────────────  ──────────────────────────────────────────────────────
#   (unset / empty)    Falls back to "self-hosted" (your local Windows PC)
#   self-hosted        Your registered runner on this machine
#   ubuntu-latest      GitHub-hosted Linux  (free 2 000 min/mo on private repo)
#   windows-latest     GitHub-hosted Windows (expensive — avoid unless needed)
#
# All steps use pwsh (cross-platform). pwsh is installed on both
# Windows self-hosted and ubuntu-latest runners.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy-shop-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  package:
    needs: ci
    uses: ./.github/workflows/deploy-package.yml
    with:
      version: ""
    secrets: inherit

  push-deploy:
    needs: package
    runs-on: ${{ vars.RUNNER || 'self-hosted' }}
    steps:
      - name: Download deploy.zip from release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $VER = "v${{ needs.package.outputs.version }}"
          Write-Output "Downloading deploy.zip from release $VER"
          gh release download $VER `
            --repo "${{ github.repository }}" `
            --pattern "deploy.zip" `
            --clobber
          Get-Item deploy.zip | Select-Object Name, Length

      - name: Push GITHUB_TOKEN to server .env
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $envUrl = "${{ vars.APP_URL }}/deploy/env?token=${{ secrets.DEPLOY_TOKEN }}"
          for ($i = 1; $i -le 3; $i++) {
            $resp = curl.exe -s -X POST --max-time 60 -H "Content-Type: application/json" `
              -d "{`"values`":{`"GITHUB_TOKEN`":`"${{ secrets.GH_TOKEN }}`"}}" `
              $envUrl 2>&1
            $first = ($resp -split "`n")[0]
            Write-Output "[env $i/3] $first"
            if ($first -match '"success":true') {
              Write-Output "GITHUB_TOKEN pushed to server .env"
              exit 0
            }
            if ($i -lt 3) { Start-Sleep -Seconds 20 }
          }
          Write-Output "GITHUB_TOKEN push did not confirm; manual: POST $envUrl"

      - name: Upload deploy archive to server
        shell: pwsh
        run: |
          $VER = "v${{ needs.package.outputs.version }}"
          Write-Output "Release: $VER"
          $checkUrl = "${{ vars.APP_URL }}/deploy/check?token=${{ secrets.DEPLOY_TOKEN }}"
          $uploadUrl = "${{ vars.APP_URL }}/deploy/upload?token=${{ secrets.DEPLOY_TOKEN }}"

          function Poll-Check {
            $consecutiveNonJson = 0
            for ($i = 1; $i -le 8; $i++) {
              $resp = curl.exe -s -X POST --max-time 30 $checkUrl 2>&1
              $first = ($resp -split "`n")[0]
              if ($first -match '"status":"deployed"') {
                Write-Output "Deployed via /deploy/check (GitHub API)"
                Write-Output $first
                return $true
              } elseif ($first -match '"status":"current"') {
                $consecutiveNonJson = 0
                if ($first -match "`"tag`":`"$VER`"") {
                  Write-Output "Confirmed on $VER via /deploy/check"
                  Write-Output $first
                  return $true
                }
                $currentTag = if ($first -match '"tag":"([^"]*)"') { $Matches[1] } else { "?" }
                Write-Output "[poll $i/8] server on $currentTag, waiting for $VER"
              } elseif ($first -match '"status":"locked"') {
                $consecutiveNonJson = 0
                Write-Output "[poll $i/8] server still working (locked)"
              } else {
                $consecutiveNonJson++
                Write-Output "[poll $i/8] server not responding (non-JSON $consecutiveNonJson/2)"
                if ($consecutiveNonJson -ge 2) {
                  Write-Output "Fast-fail: server is broken, skipping remaining polls"
                  return $false
                }
              }
              if ($i -lt 8) { Start-Sleep -Seconds 15 }
            }
            return $false
          }

          function Confirm-Deployed {
            $consecutiveNonJson = 0
            for ($i = 1; $i -le 8; $i++) {
              $resp = curl.exe -s --max-time 30 $checkUrl 2>&1
              $first = ($resp -split "`n")[0]
              if ($first -match '"status":"deployed"') {
                Write-Output "Confirmed deployed via /deploy/check"
                Write-Output $first
                return $true
              } elseif ($first -match '"status":"current"') {
                $consecutiveNonJson = 0
                if ($first -match "`"tag`":`"$VER`"") {
                  Write-Output "Confirmed on $VER via /deploy/check"
                  Write-Output $first
                  return $true
                }
                Write-Output "[confirm $i/8] tag not yet $VER, retrying"
              } elseif ($first -match '"status":"locked"') {
                $consecutiveNonJson = 0
                Write-Output "[confirm $i/8] server still working (locked), retrying"
              } else {
                $consecutiveNonJson++
                Write-Output "[confirm $i/8] server not responding (non-JSON $consecutiveNonJson/2)"
                if ($consecutiveNonJson -ge 2) {
                  Write-Output "Fast-fail: server is broken, skipping remaining confirms"
                  return $false
                }
              }
              if ($i -lt 8) { Start-Sleep -Seconds 15 }
            }
            return $false
          }

          if (Poll-Check) {
            Write-Output "push-deploy OK (check path)"
          } else {
            Write-Output "check path did not confirm $VER, uploading deploy.zip directly"
            $uploadResp = curl.exe -s -w "\n%{http_code}" --max-time 300 `
              -F "file=@deploy.zip;filename=deploy.zip" `
              $uploadUrl 2>&1
            $lines = $uploadResp -split "`n"
            $httpCode = $lines[-1]
            $body = ($lines[0..($lines.Count-2)] -join "`n")
            Write-Output "Upload HTTP $httpCode"
            if ($httpCode -eq "200" -and $body -match '"status":"deployed"') {
              Write-Output "Deployed via /deploy/upload"
              Write-Output "push-deploy OK (upload path)"
            } else {
              Write-Output "Upload response not clean (HTTP $httpCode), confirming via /deploy/check..."
              if (Confirm-Deployed) {
                Write-Output "push-deploy OK (confirmed after upload)"
              } else {
                Write-Output "Deploy not confirmed. Release at: https://github.com/${{ github.repository }}/releases/tag/$VER"
                Write-Output "Manual: download deploy.zip, upload to server, extract, then visit:"
                Write-Output "${{ vars.APP_URL }}/deploy/cache-clear?token=${{ secrets.DEPLOY_TOKEN }}"
                exit 1
              }
            }
          }

      - name: FTP Upload fallback (DirectAdmin)
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $ftpPort = if ("${{ secrets.FTP_PORT }}") { "${{ secrets.FTP_PORT }}" } else { "21" }
          $ftpUrl = "ftp://${{ secrets.FTP_SERVER }}:$ftpPort/deploy.zip"
          $cred = New-Object System.Net.NetworkCredential("${{ secrets.FTP_USERNAME }}", "${{ secrets.FTP_PASSWORD }}")
          try {
            $ftp = [System.Net.FtpWebRequest]::Create($ftpUrl)
            $ftp.Method = [System.Net.WebRequestMethods+Ftp]::UploadFile
            $ftp.Credentials = $cred
            $ftp.UseBinary = $true
            $ftp.UsePassive = $true
            $ftp.KeepAlive = $false
            $fileBytes = [System.IO.File]::ReadAllBytes("deploy.zip")
            $ftp.ContentLength = $fileBytes.Length
            $rs = $ftp.GetRequestStream()
            $rs.Write($fileBytes, 0, $fileBytes.Length)
            $rs.Close()
            $resp = $ftp.GetResponse()
            Write-Output "FTP upload OK: $($resp.StatusDescription)"
            $resp.Close()
            Write-Output "---"
            Write-Output "Extract via DirectAdmin File Manager, then visit:"
            Write-Output "${{ vars.APP_URL }}/deploy/cache-clear?token=${{ secrets.DEPLOY_TOKEN }}"
          } catch {
            Write-Output "FTP upload failed: $_"
            $VER = "${{ needs.package.outputs.version }}"
            Write-Output "Manual steps:"
            Write-Output "1. Download from: https://github.com/${{ github.repository }}/releases/download/v$VER/deploy.zip"
            Write-Output "2. Upload via DirectAdmin File Manager to public_html/"
            Write-Output "3. Extract, then visit:"
            Write-Output "   ${{ vars.APP_URL }}/deploy/cache-clear?token=${{ secrets.DEPLOY_TOKEN }}"
          }
