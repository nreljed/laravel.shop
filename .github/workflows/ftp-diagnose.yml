name: FTP Diagnose

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose FTP login and path
        shell: pwsh
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          TARGET_PATH: domains/shop.laravel.tunispromo.tn/public_html
        run: |
          $ErrorActionPreference = 'Stop'
          $port = if ($env:FTP_PORT) { [int]$env:FTP_PORT } else { 21 }
          Write-Output "Server: $($env:FTP_SERVER)  Port: $port  User: $($env:FTP_USERNAME)"
          Write-Output "Target path: $($env:TARGET_PATH)"

          # Raw TCP/FTP session so we see each stage's status code.
          function Read-Reply($stream, $buf) {
            $sb = New-Object System.Text.StringBuilder
            do {
              Start-Sleep -Milliseconds 300
              $n = $stream.Read($buf, 0, $buf.Length)
              if ($n -gt 0) { [void]$sb.Append([System.Text.Encoding]::ASCII.GetString($buf, 0, $n)) }
            } while ($stream.DataAvailable)
            $text = $sb.ToString().Trim()
            $code = if ($text -match '^(\d{3})') { $matches[1] } else { '???' }
            return [PSCustomObject]@{ Code = $code; Text = ($text -replace "`r|`n", ' ').Substring(0, [Math]::Min(60, ($text -replace "`r|`n", ' ').Length)) }
          }
          function Send-Line($stream, $buf, $line) {
            $bytes = [System.Text.Encoding]::ASCII.GetBytes($line + "`r`n")
            $stream.Write($bytes, 0, $bytes.Length)
            $stream.Flush()
            return Read-Reply $stream $buf
          }

          $tcp = New-Object System.Net.Sockets.TcpClient
          try {
            $tcp.Connect($env:FTP_SERVER, $port)
            Write-Output "CONNECT: OK"
            $stream = $tcp.GetStream()
            $stream.ReadTimeout = 10000
            $buf = New-Object byte[] 4096
            $r = Read-Reply $stream $buf
            Write-Output "BANNER: [$($r.Code)] $($r.Text)"

            $r = Send-Line $stream $buf "USER $($env:FTP_USERNAME)"
            Write-Output "USER:   [$($r.Code)] $($r.Text)"

            if ($r.Code -eq '331' -or $r.Code -eq '230') {
              $r = Send-Line $stream $buf "PASS $($env:FTP_PASSWORD)"
              Write-Output "PASS:   [$($r.Code)] $($r.Text)"
            } else {
              Write-Output "PASS:   skipped (USER rejected)"
            }

            if ($r.Code -eq '230') {
              $r = Send-Line $stream $buf "TYPE I"
              Write-Output "TYPE I: [$($r.Code)] $($r.Text)"

              $r = Send-Line $stream $buf "CWD $($env:TARGET_PATH)"
              Write-Output "CWD:    [$($r.Code)] $($r.Text)"

              # Try creating+listing a probe file in the target dir (not overwriting deploy.zip).
              $probe = "ci-ftp-probe-$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())"
              $r = Send-Line $stream $buf "DELE $probe"
              Write-Output "DELE(pre): [$($r.Code)]"
              $r = Send-Line $stream $buf "STOR $probe"
              Write-Output "STOR:   [$($r.Code)] $($r.Text)"
              if ($r.Code -eq '150' -or $r.Code -eq '125') {
                $data = [System.Text.Encoding]::ASCII.GetBytes("probe")
                $stream.Write($data, 0, $data.Length)
                $stream.Flush()
                Start-Sleep -Milliseconds 500
                $r = Read-Reply $stream $buf
                Write-Output "STOR-CMPL: [$($r.Code)] $($r.Text)"
              }
              $r = Send-Line $stream $buf "DELE $probe"
              Write-Output "DELE(post): [$($r.Code)]"
            }

            $r = Send-Line $stream $buf "QUIT"
            Write-Output "QUIT:   [$($r.Code)]"
          } catch {
            Write-Output "EXCEPTION: $($_.Exception.Message)"
            if ($_.Exception.InnerException) { Write-Output "INNER: $($_.Exception.InnerException.Message)" }
          } finally {
            $tcp.Close()
          }
