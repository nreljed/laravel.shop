name: Core Update (dashboard-core)

on:
  schedule:
    # Weekly: Monday 09:00 UTC, matching the core repo's publish cadence.
    - cron: "0 9 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [core-updated]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: core-update
  cancel-in-progress: true

jobs:
  core-update:
    # Self-hosted runner (win-runner): free minutes, immune to hosted billing
    # blocks. Runner is Windows — pin bash explicitly; the runner process must
    # have "C:\Program Files\Git\bin" ahead of system32 in its PATH so `bash`
    # resolves to Git Bash and not the WSL stub.
    runs-on: [self-hosted]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # PHP 8.4 + composer are preinstalled on the self-hosted runner;
      # setup-php only makes sense on GitHub-hosted machines.
      - name: Setup PHP
        if: runner.os == 'Linux'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      # dashboard-core + shop-module are private vcs repos; the single GH_TOKEN
      # (Contents: Read on all four nreljed repos, see AGENTS.md) authenticates
      # both clones. --no-scripts avoids
      # booting Laravel in a bare checkout (no .env needed for the lock update).
      - name: Update dashboard-core
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GH_TOKEN }}"}}'
        run: composer update nreljed/dashboard-core --with-dependencies --no-scripts --no-interaction

      - name: Check for changes
        id: check
        run: |
          if git diff --exit-code -- composer.lock > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Core is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New core version available."
          fi

      - name: Read resolved core version
        if: steps.check.outputs.changed == 'true'
        id: version
        run: |
          VER=$(php -r 'echo json_decode(file_get_contents("vendor/nreljed/dashboard-core/composer.json"), true)["version"] ?? "unknown";')
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      # Only composer.lock ships in the PR. public/build is gitignored and CI
      # (pr.yml -> ci.yml) rebuilds assets + runs the full validation suite.
      - name: Create pull request
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="core/update-v${{ steps.version.outputs.version }}"
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "chore: update dashboard-core to v${{ steps.version.outputs.version }}"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: update dashboard-core to v${{ steps.version.outputs.version }}" \
            --body "Automated update of \`nreljed/dashboard-core\` (scheduled \`core-update.yml\`).

            - Resolved version: v${{ steps.version.outputs.version }}
            - Only \`composer.lock\` changed; \`public/build\` is gitignored and rebuilt by CI.

            After merge, push to main triggers \`deploy.yml\` (build + release + deploy).
            "
