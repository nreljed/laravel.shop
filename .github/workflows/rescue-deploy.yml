name: Rescue Restore Shop

on:
  workflow_dispatch:
  push:
    branches: [rescue-test]

jobs:
  mirror:
    runs-on: ${{ vars.RUNNER_CI || 'self-hosted' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Download + extract known-good v0.10.24
        run: |
          rm -rf x && mkdir x
          ASSET_ID=$(gh api "repos/nreljed/laravel.shop/releases/tags/v0.10.24" --jq '.assets[] | select(.name=="deploy.zip") | .id')
          echo "asset id: $ASSET_ID"
          gh api "repos/nreljed/laravel.shop/releases/assets/$ASSET_ID" -H "Accept: application/octet-stream" > v01024.zip
          ls -la v01024.zip
          "/c/Program Files/7-Zip/7z.exe" x v01024.zip -ox -y >/dev/null 2>&1 && echo "7z extract ok"
          ls x | head -30
          echo "vendor count: $(ls x/vendor 2>/dev/null | wc -l)"
          echo "total files: $(find x -type f | wc -l)"

      - name: Mirror tree to FTP (curl parallel)
        env:
          U: "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}"
          BHOST: "${{ secrets.FTP_SERVER }}:${{ secrets.FTP_PORT }}"
        run: |
          set -u
          ROOT="$(pwd)"
          HOMEDIR="/"
          echo "first pass: create dir tree (curl creates dirs lazily via --ftp-create-dirs)"
          find x -type f \
            -not -path 'x/.env' \
            -not -path 'x/storage/*' \
            -not -path 'x/database/*' \
            -not -path 'x/public_html/*' \
            -not -name 'deploy.zip' \
            -not -name 'restore.php' \
            -not -name 'recover.php' \
            -not -name 'fix-vendor.php' \
            -not -name 'debug.php' \
            > files.txt
          echo "files to upload: $(wc -l < files.txt)"
          cat > up_one.sh << 'EOF'
          #!/bin/bash
          set -u
          lpath="$1"
          rel="${lpath#x/}"
          curl -sS --fail --ftp-create-dirs --user "$U" -T "$ROOT/$lpath" "ftp://${BHOST}/${rel}" \
            && echo "OK $rel" \
            || echo "FAIL $rel"
          EOF
          chmod +x up_one.sh
          export ROOT U BHOST
          cat files.txt | xargs -P 10 -I{} ./up_one.sh "{}" | tee upload.log | grep -c '^OK' | xargs -I{} echo "UPLOADED_OK={}"
          echo "failed: $(grep -c '^FAIL' upload.log || true)"
          grep '^FAIL' upload.log | head -30 || true

      - name: Write .deployed-version + cleanup stray helpers
        env:
          U: "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}"
          BHOST: "${{ secrets.FTP_SERVER }}:${{ secrets.FTP_PORT }}"
        run: |
          printf 'v0.10.24\n' > dv.txt
          curl -sS --fail --user "$U" -T dv.txt "ftp://${BHOST}/.deployed-version" && echo "version written"
          for f in restore.php recover.php fix-vendor.php debug.php; do
            curl -sS --user "$U" -Q "DELE $f" "ftp://${BHOST}/public/$f" 2>/dev/null && echo "deleted public/$f" || true
          done
          echo "done"