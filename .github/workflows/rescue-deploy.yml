name: Rescue Restore Shop

on:
  workflow_dispatch:
  push:
    branches: [rescue-test]

jobs:
  restore:
    runs-on: ${{ vars.RUNNER_CI || 'self-hosted' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Download known-good deploy.zip (v0.10.24 = pre-migration build)
        run: |
          curl -sL -o deploy.zip "https://github.com/nreljed/laravel.shop/releases/download/v0.10.24/deploy.zip"
          ls -la deploy.zip

      - name: Generate standalone rescue extractor
        run: |
          cat > restore.php << 'RESTORE'
          <?php
          ini_set('memory_limit', '512M');
          ini_set('max_execution_time', '300');
          /// One-shot rescue: reinstall good deploy.zip over the project root,
          /// then clear volatile state so the app can boot again.
          $key = $_GET['k'] ?? '';
          if (!hash_equals('f0d7943e68cb15a2', $key)) { http_response_code(403); echo 'no'; exit; }
          $self = dirname(__FILE__);
          $app = '';
          foreach ([$self, dirname($self), $self . '/public_html', $self . '/../'] as $cand) {
              if (is_file(rtrim($cand, '/\\') . '/artisan')) { $app = rtrim($cand, '/\\'); break; }
          }
          if ($app === '') { http_response_code(500); echo 'no-app-root self=' . $self; exit; }
          $zipPath = $app . '/deploy.zip';
          if (!is_file($zipPath)) { http_response_code(404); echo 'no-zip ' . $zipPath; exit; }
          $env = is_file($app . '/.env') ? file_get_contents($app . '/.env') : '';
          @unlink($app . '/.deploy-lock');
          $z = new ZipArchive();
          if ($z->open($zipPath) !== true) { http_response_code(500); echo 'bad-zip'; exit; }
          foreach (['vendor', 'bootstrap/cache'] as $d) {
              $p = $app . '/' . $d;
              if (is_dir($p)) { rmTree($p); }
          }
          $ok = $z->extractTo($app);
          $z->close();
          if (!$ok) { http_response_code(500); echo 'extract-failed'; exit; }
          if ($env !== '') { file_put_contents($app . '/.env', $env); }
          file_put_contents($app . '/.deployed-version', 'v0.10.24');
          echo "OK app=$app entries extracted\n";
          function rmTree($path) {
              if (!is_dir($path)) { @unlink($path); return; }
              foreach (scandir($path) as $e) {
                  if ($e === '.' || $e === '..') { continue; }
                  $f = $path . '/' . $e;
                  is_dir($f) ? rmTree($f) : @unlink($f);
              }
              @rmdir($path);
          }
          RESTORE
          ls -la restore.php

      - name: FTP upload (all candidate docroots)
        run: |
          for f in deploy.zip restore.php; do
            for d in "" public public_html public_html/public; do
              P="$d/"; [ -z "$d" ] && P=""
              curl -s --max-time 300 -T "$f" \
                --ftp-create-dirs \
                --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
                "ftp://${{ secrets.FTP_SERVER }}:${{ secrets.FTP_PORT }}/${P}$f" && echo "uploaded ${P}$f"
            done
          done

      - name: Trigger extractor and wait
        run: |
          for i in $(seq 1 30); do
            for url in \
              "https://shop.laravel.tunispromo.tn/restore.php?k=f0d7943e68cb15a2" \
              "https://shop.laravel.tunispromo.tn/public/restore.php?k=f0d7943e68cb15a2" \
              "https://shop.laravel.tunispromo.tn/public_html/restore.php?k=f0d7943e68cb15a2" \
              "https://shop.laravel.tunispromo.tn/public_html/public/restore.php?k=f0d7943e68cb15a2" \
            ; do
              RESP=$(curl -s --max-time 30 "$url")
              if case "$RESP" in OK*) true;; *) false;; esac; then
                echo "extractor OK via $url -> $RESP"
                exit 0
              fi
            done
            sleep 5
          done
          echo "extractor did not confirm"
          exit 1

      - name: Verify app is back
        run: |
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /tmp/up.body -w "%{http_code}" --max-time 30 "https://shop.laravel.tunispromo.tn/up")
            echo "up probe $i: HTTP $CODE body=$(cat /tmp/up.body)"
            if [ "$CODE" = "200" ]; then echo "RECOVERED"; exit 0; fi
            sleep 10
          done
          echo "still not recovered"
          exit 1

      - name: Cleanup remote restore.php
        if: always()
        continue-on-error: true
        run: |
          for f in restore.php; do
            curl -s --max-time 60 -Q "DELE $f" \
              --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
              "ftp://${{ secrets.FTP_SERVER }}:${{ secrets.FTP_PORT }}/" || true
          done